name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  # Split out from `verify` on purpose. Requirements 3.1 and 3.7 are Riot
  # approval blockers (R13.6), so their test suites get their own required check
  # with an unmistakable name — a reviewer looking at a red PR should be able to
  # tell "this leaks augment win rates" apart from "a snapshot test drifted"
  # without opening the logs.
  #
  # _Requirements: 3.1, 3.7, 13.6 — tasks.md 2.6, 2.13, X.6, X.7_
  compliance:
    name: Riot compliance gates (release-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Through Turborepo, not `npm run --workspaces`. The workspace packages
      # resolve via their built `dist/`, so `@tft-codex/shared-types` has to be
      # built before anything importing it can even load. Turbo's `^build`
      # dependency handles that; invoking the scripts directly does not, and
      # that mismatch is what made this gate fail on every run from Phase 1 to
      # Phase 3 while the suites themselves were green.
      - name: Augment display restriction (R3.1)
        run: npx turbo run test:compliance

      - name: Assert Tier-3 stays disabled by default (R3.7)
        run: |
          if grep -rn 'RIOT_TIER3_RECOMMENDATIONS_CONFIRMED\s*=\s*true' \
               --include='*.example' --include='*.yml' --include='*.yaml' \
               --include='*.ts' --include='*.tsx' . ; then
            echo "::error::Tier-3 adaptive recommendations are enabled somewhere in the repo."
            echo "R3.7 requires written Riot confirmation on file before this flag is set."
            echo "See docs/approvals.md."
            exit 1
          fi
          echo "Tier-3 flag is off everywhere in the repo."
